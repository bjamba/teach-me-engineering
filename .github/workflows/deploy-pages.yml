name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: learn-svelte/package-lock.json

      - name: Install learn-svelte dependencies
        working-directory: learn-svelte
        run: npm ci

      - name: Build learn-svelte
        working-directory: learn-svelte
        env:
          BASE_PATH: '/teach-me-engineering/learn-svelte'
        run: npm run build

      - name: Assemble Pages artifact
        run: |
          mkdir -p site
          # Copy the whole repo (all the existing static courses + root index.html)
          # but drop learn-svelte source, .git, and CI plumbing
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='learn-svelte' \
            --exclude='site' \
            ./ site/
          # Drop learn-svelte's built SPA into site/learn-svelte/
          mkdir -p site/learn-svelte
          rsync -a learn-svelte/build/ site/learn-svelte/
          # Sanity: list what we're shipping at the top level
          ls -la site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
