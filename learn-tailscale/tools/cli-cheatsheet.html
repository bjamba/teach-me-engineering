<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CLI cheatsheet · Tools</title>
<link rel="stylesheet" href="../assets/styles.css" />
<style>
.search-bar { background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.85rem 1rem; margin: 1rem 0; display: flex; align-items: center; gap: 0.5rem; }
.search-bar input { flex: 1; background: var(--bg-code); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0.5rem 0.85rem; color: var(--text); font-family: inherit; font-size: 0.95rem; outline: none; }
.search-bar input:focus { border-color: var(--accent); }
.cat { margin: 1.5rem 0 0.6rem; }
.cat h2 { font-size: 1rem; color: var(--accent); margin: 0 0 0.5rem; font-family: var(--font-mono); }
.cmd-row { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 0.6rem; background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0.7rem 0.95rem; margin-bottom: 0.45rem; transition: border-color 120ms; }
.cmd-row:hover { border-color: var(--border-strong); }
.cmd-row[data-hidden="true"] { display: none; }
.cmd-row .cmd { font-family: var(--font-mono); font-size: 0.85rem; color: var(--accent); }
.cmd-row .desc { color: var(--text-muted); font-size: 0.88rem; }
.copy-btn { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 4px; padding: 0.15rem 0.5rem; font-size: 0.7rem; color: var(--text-muted); cursor: pointer; margin-left: 0.4rem; font-family: inherit; }
.copy-btn:hover { color: var(--accent); border-color: var(--accent); }
.copy-btn.copied { color: var(--ok); border-color: var(--ok); }
@media (max-width: 720px) { .cmd-row { grid-template-columns: 1fr; gap: 0.3rem; } }
</style>
</head>
<body>

<nav class="site-nav">
  <a class="logo" href="../dashboard.html"><span class="dot"></span> Learn Tailscale</a>
  <span class="crumbs"><span class="sep">›</span><a href="../dashboard.html">Dashboard</a><span class="sep">›</span><span class="here">CLI cheatsheet</span></span>
  <span class="spacer"></span>
</nav>

<div class="container" style="padding-top: 1.5rem;">
  <h1 style="font-size: clamp(1.6rem, 3vw, 2rem); margin: 0 0 0.4rem;">⌨️ CLI cheatsheet</h1>
  <p style="color: var(--text-muted); margin: 0; max-width: 70ch;">Every <code>tailscale</code> command worth knowing. Click any to copy.</p>

  <div class="search-bar">
    <span style="color: var(--text-faint);">🔍</span>
    <input id="search" placeholder="Search commands..." autocomplete="off" />
  </div>

  <div id="cats"></div>
</div>

<script>
const CATS = [
  { name: "Status & info", commands: [
    { cmd: "tailscale status", desc: "List all devices on your tailnet with state and IPs" },
    { cmd: "tailscale ip", desc: "Show this device's tailnet IP" },
    { cmd: "tailscale ip -4 home-server", desc: "Resolve a peer's tailnet IPv4" },
    { cmd: "tailscale netcheck", desc: "Diagnose connectivity (NAT type, DERP latency)" },
    { cmd: "tailscale version", desc: "Show installed Tailscale version" },
    { cmd: "tailscale whois 100.64.10.5", desc: "Look up which device owns a tailnet IP" },
  ]},
  { name: "Bring up / down", commands: [
    { cmd: "sudo tailscale up", desc: "Connect (interactive auth)" },
    { cmd: "sudo tailscale up --auth-key=tskey-...", desc: "Non-interactive auth (headless)" },
    { cmd: "sudo tailscale up --advertise-tags=tag:server", desc: "Apply a tag at registration" },
    { cmd: "sudo tailscale down", desc: "Disconnect from the tailnet" },
    { cmd: "sudo tailscale logout", desc: "Log out and forget credentials" },
    { cmd: "sudo tailscale up --reset", desc: "Reset all flags to defaults" },
  ]},
  { name: "Ping & connectivity", commands: [
    { cmd: "tailscale ping home-server", desc: "Ping with details on direct vs relay" },
    { cmd: "tailscale ping --until-direct home-server", desc: "Wait until connection is direct (not DERP)" },
    { cmd: "tailscale netcheck", desc: "Show your NAT type and DERP latency" },
  ]},
  { name: "Serve (private)", commands: [
    { cmd: "sudo tailscale serve --bg https http://localhost:3000", desc: "Expose localhost:3000 to the tailnet over HTTPS" },
    { cmd: "sudo tailscale serve --bg https /path/to/files", desc: "Serve a directory of static files" },
    { cmd: "sudo tailscale serve status", desc: "Show current serve config" },
    { cmd: "sudo tailscale serve reset", desc: "Clear all serve config" },
    { cmd: "sudo tailscale serve --https=443 off", desc: "Stop serving on port 443" },
  ]},
  { name: "Funnel (public)", commands: [
    { cmd: "sudo tailscale funnel --bg 8080", desc: "Publish localhost:8080 to the public internet (requires policy attr)" },
    { cmd: "sudo tailscale funnel status", desc: "Show current funnel config" },
    { cmd: "sudo tailscale funnel --https=443 off", desc: "Stop the public exposure" },
  ]},
  { name: "Routes (subnet routers)", commands: [
    { cmd: "sudo tailscale up --advertise-routes=192.168.1.0/24", desc: "Offer to route a subnet (also requires admin approval)" },
    { cmd: "sudo tailscale up --accept-routes", desc: "Accept advertised subnet routes from peers" },
  ]},
  { name: "Exit nodes", commands: [
    { cmd: "sudo tailscale up --advertise-exit-node", desc: "Offer this device as an exit node" },
    { cmd: "sudo tailscale up --exit-node=home-server", desc: "Use home-server as your exit node" },
    { cmd: "sudo tailscale up --exit-node=", desc: "Stop using any exit node" },
    { cmd: "tailscale exit-node list", desc: "List available exit nodes" },
  ]},
  { name: "Tailscale SSH", commands: [
    { cmd: "sudo tailscale up --ssh", desc: "Enable Tailscale SSH on this device" },
    { cmd: "ssh user@home-server", desc: "Standard SSH command — works once Tailscale SSH is enabled" },
  ]},
  { name: "Files (Taildrop)", commands: [
    { cmd: "tailscale file cp ./report.pdf home-server:", desc: "Send a file to another tailnet device (Taildrop)" },
    { cmd: "tailscale file get .", desc: "Receive any pending Taildrop files" },
  ]},
  { name: "Certificates", commands: [
    { cmd: "sudo tailscale cert your-device.tail-abc.ts.net", desc: "Get TLS cert files for a hostname (for use in your own server)" },
  ]},
  { name: "Diagnostics", commands: [
    { cmd: "tailscale bugreport", desc: "Generate diagnostic info for support tickets" },
    { cmd: "journalctl -u tailscaled -f", desc: "Watch Linux service logs (when stuck)" },
    { cmd: "sudo tailscale debug daemon-logs", desc: "Show daemon logs" },
  ]},
  { name: "Useful environment vars", commands: [
    { cmd: "TS_AUTHKEY=tskey-... tailscale up", desc: "Provide auth key via env (alternative to --auth-key)" },
    { cmd: "OLLAMA_HOST=0.0.0.0:11434", desc: "Make Ollama listen on all interfaces (related project)" },
  ]},
];

const catsEl = document.getElementById('cats');
catsEl.innerHTML = CATS.map(cat => `
  <div class="cat">
    <h2>${cat.name}</h2>
    ${cat.commands.map(c => `
      <div class="cmd-row" data-search="${(c.cmd + ' ' + c.desc).toLowerCase()}">
        <div class="cmd">${escapeHtml(c.cmd)} <button class="copy-btn" data-copy="${escapeAttr(c.cmd)}">copy</button></div>
        <div class="desc">${c.desc}</div>
      </div>`).join('')}
  </div>`).join('');

function escapeHtml(s) { return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function escapeAttr(s) { return s.replace(/"/g, '&quot;'); }

document.querySelectorAll('.copy-btn').forEach(btn => {
  btn.addEventListener('click', async (e) => {
    e.stopPropagation();
    try {
      await navigator.clipboard.writeText(btn.dataset.copy);
      const orig = btn.textContent;
      btn.textContent = 'copied!';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 1200);
    } catch (e) {}
  });
});

const search = document.getElementById('search');
search.addEventListener('input', () => {
  const q = search.value.trim().toLowerCase();
  document.querySelectorAll('.cmd-row').forEach(r => {
    r.dataset.hidden = (!q || r.dataset.search.includes(q)) ? 'false' : 'true';
  });
  document.querySelectorAll('.cat').forEach(cat => {
    const visible = cat.querySelectorAll('.cmd-row:not([data-hidden="true"])').length;
    cat.style.display = visible ? 'block' : 'none';
  });
});
</script>

</body>
</html>
