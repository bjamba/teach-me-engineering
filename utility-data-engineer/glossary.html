<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glossary · Utility Data Engineer</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  .gl-entry { padding: 14px 0; border-bottom: 1px solid var(--c-border); scroll-margin-top: 80px; }
  .gl-entry:target { background: rgba(41,181,232,.08); border-left: 3px solid var(--c-accent); padding-left: 10px; }
  .gl-term { font-weight: 700; font-size: 17px; color: var(--c-accent-hi); margin: 0; }
  .gl-module { float: right; }
  .gl-def { margin: 6px 0 0; color: var(--c-text-dim); }
</style>
</head>
<body>

<nav class="site-nav">
  <a href="dashboard.html">🏠 Dashboard</a>
  <span class="nav-sep">›</span>
  <span class="nav-current">📖 Glossary</span>
</nav>

<main class="container">

<h1>📖 Glossary</h1>
<p class="lede">Every term used in the course. Lessons link to specific entries via anchor (e.g., <code>#virtual-warehouse</code>). Search is live — type to filter.</p>

<input type="search" id="gl-search" placeholder="Search term or definition..." autofocus>

<div style="margin-top: 16px;" id="gl-filters">
  <span class="tag" data-mod="">all</span>
</div>

<section id="gl-list" style="margin-top: 20px;"></section>

</main>

<script src="assets/glossary-data.js"></script>
<script>
const entries = window.UDE_GLOSSARY.slice().sort((a,b) => a.term.localeCompare(b.term));
const modules = Array.from(new Set(entries.map(e => e.module))).sort();
const filters = document.getElementById("gl-filters");
modules.forEach(m => {
  const s = document.createElement("span");
  s.className = "tag";
  s.style.cursor = "pointer";
  s.dataset.mod = m;
  s.textContent = m;
  filters.appendChild(s);
});
let activeMod = "";
filters.addEventListener("click", (e) => {
  if (e.target.classList.contains("tag")) {
    activeMod = e.target.dataset.mod || "";
    Array.from(filters.children).forEach(c => c.style.background = c.dataset.mod === activeMod ? "var(--c-accent)" : "");
    Array.from(filters.children).forEach(c => c.style.color = c.dataset.mod === activeMod ? "#0a1218" : "");
    render();
  }
});

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[c]); }
function highlight(s, q) {
  if (!q) return esc(s);
  const re = new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+")", "gi");
  return esc(s).replace(re, '<mark style="background:var(--c-accent);color:#0a1218;padding:0 2px;border-radius:2px;">$1</mark>');
}

function render() {
  const q = document.getElementById("gl-search").value.trim().toLowerCase();
  const list = document.getElementById("gl-list");
  const filtered = entries.filter(e => {
    if (activeMod && e.module !== activeMod) return false;
    if (!q) return true;
    return e.term.toLowerCase().includes(q) || e.def.toLowerCase().includes(q);
  });
  if (!filtered.length) {
    list.innerHTML = '<p class="faint" style="text-align:center;padding:40px 0;">No matching terms.</p>';
    return;
  }
  list.innerHTML = filtered.map(e =>
    '<div class="gl-entry" id="'+e.id+'">' +
      '<h3 class="gl-term">' + highlight(e.term, q) + '<span class="gl-module tag">'+e.module+'</span></h3>' +
      '<p class="gl-def">' + highlight(e.def, q) + '</p>' +
    '</div>'
  ).join("");
  // If URL has hash, scroll to it
  if (location.hash) {
    const el = document.getElementById(location.hash.slice(1));
    if (el) el.scrollIntoView();
  }
}
document.getElementById("gl-search").addEventListener("input", render);
render();
window.addEventListener("hashchange", render);
</script>
<script src="assets/progress.js"></script>
<script src="assets/notepad.js"></script>
</body>
</html>
